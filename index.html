<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LockIn — Earn It</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1512;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .coin { font-size: 48px; margin-bottom: 24px; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }
    .tagline {
      font-size: 15px;
      color: #8E8E93;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 48px;
    }
    .tagline span { color: #FFD700; font-weight: 600; }
    .coming-soon {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8E8E93;
      border: 1px solid #2a2018;
      padding: 8px 20px;
      border-radius: 20px;
      margin-bottom: 48px;
    }
    footer {
      position: fixed;
      bottom: 24px;
      font-size: 12px;
      color: #555;
    }
    footer a { color: #555; text-decoration: none; margin: 0 12px; }
    footer a:hover { color: #8E8E93; }
  </style>
</head>
<body>
  <div class="coin">🔒</div>
  <h1>LockIn</h1>
  <p class="tagline">
    You can't buy muscles.<br>
    And you can't buy our coins.<br>
    <span>Earn it.</span>
  </p>
  <div class="coming-soon">Coming Soon</div>
  <footer>
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
    <a href="mailto:privacy@lockinfit.app">Contact</a>
  </footer>
</body>
</html>
